# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:clipboard"
set -s escape-time 0
set -g focus-events on
set -s set-clipboard external

# General behavior
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g detach-on-destroy off

# New windows and panes inherit the current working directory
bind c new-window -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind d split-window -h -c "#{pane_current_path}"

# Resize panes repeatedly while holding the prefix table open
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Vi-style copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload this configuration
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Allow terminal graphics protocols through tmux for notebook images
set -g allow-passthrough on

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Save tmux state every 15 minutes and restore it when tmux starts.
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# TPM must remain last
run-shell "~/.tmux/plugins/tpm/tpm"
